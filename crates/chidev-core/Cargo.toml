[package]
name = "chidev-core"
description = "Core (SDK) of chidev: Contract, Interface and Harness as the assets of a codebase; the code is a cache pinned to them"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/chidev-core"
readme.workspace = true

[dependencies]
rusqlite.workspace = true
rusqlite-isle.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
toml.workspace = true
tokio = { workspace = true, features = ["process", "time", "io-util", "fs"] }
uuid = { workspace = true, features = ["v7"] }

[dev-dependencies]
arch-lint.workspace = true
tokio.workspace = true
