[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Yutaka Nishimura"]
repository = "https://github.com/ynishi/chidev"
homepage = "https://github.com/ynishi/chidev"
documentation = "https://docs.rs/chidev"
readme = "README.md"

[workspace.dependencies]
chidev-core = { path = "crates/chidev-core", version = "0.1.0" }
chidev-provider-rust = { path = "crates/chidev-provider-rust", version = "0.1.0" }
arch-lint = "0.11"
# Token spans with byte ranges: the Rust provider edits the source by byte range.
proc-macro2 = { version = "1", features = ["span-locations"] }
# Function bodies and test items of a Rust source (the provider only mutates code inside function bodies).
syn = { version = "2", features = ["full", "visit"] }
# The tokens of a declaration, to find its first one past the attributes (already in the graph under syn).
quote = "1"
clap = { version = "4", features = ["derive"] }
# rusqlite-isle 0.6 tracks rusqlite 0.40; the two move together (one libsqlite3-sys in the graph).
rusqlite = { version = "0.40", default-features = false }
rusqlite-isle = { version = "0.6", features = ["tokio"] }
# The JSON Schema of what an agent writes (`chidev exec` operations) and reads (the view of the model), derived from the
# types that read and write them. `preserve_order` stays off: the stamp of an external check's input depends on it.
schemars = { version = "1.2", default-features = false, features = ["derive", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
thiserror = "2.0.21"
# Parses the settings files (`chidev.toml`, `.chidev/chidev.local.toml`); the parser and its value type, none of the serializer.
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }
tokio = { version = "1", features = ["rt", "macros"] }
uuid = { version = "1", default-features = false, features = ["std"] }
